name: StoryStage build

on:
  push:
    branches: [storystage]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [storystage]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: storystage-build-${{ github.ref }}
  cancel-in-progress: true

env:
  STORYSTAGE_VERSION: 0.1.0
  SS_MAVEN_ARGS: -B -ntp -Dinstall4j.skip=true -pl !netbeans

jobs:
  windows:
    name: Windows build and package
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      # The Sims 2 bundles are 555 MB of Git LFS objects; cache them so they
      # are downloaded from LFS only when they change.
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Fetch LFS objects
        run: git lfs pull

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven build
        run: mvn $SS_MAVEN_ARGS install

      - name: Package portable app
        run: storystage/build/package-windows.sh "$STORYSTAGE_VERSION" target/dist

      - name: Smoke test
        shell: pwsh
        run: storystage/build/smoke-test-windows.ps1 -AppDir target/dist/StoryStage

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path target/dist/StoryStage -DestinationPath "target/dist/StoryStage-${{ env.STORYSTAGE_VERSION }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: StoryStage-windows-x64
          path: target/dist/StoryStage-*-windows-x64.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-log
          path: target/smoke-test.log
          if-no-files-found: ignore

  no-sims:
    name: Build without Sims 2 assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven build without Sims
        run: mvn $SS_MAVEN_ARGS -DincludeSims=false install
